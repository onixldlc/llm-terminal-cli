name: Release

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. v0.2.4-r3). Empty = read the VERSION file.'
        required: false
        default: ''
      publish:
        description: 'Create the tag and the release. Uncheck to build only.'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi

          if [[ -z "${VERSION}" ]]; then
            echo "::error::VERSION is empty."
            exit 1
          fi

          # VERSION carries the v and the -rN revision itself (v0.2.4-r3).
          [[ "${VERSION}" == v* ]] || VERSION="v${VERSION}"

          # Git refs allow a narrow character set.
          VERSION="$(printf '%s' "${VERSION}" | tr -c 'A-Za-z0-9._-' '-')"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            PUBLISH="${INPUT_PUBLISH}"
          else
            # The only other trigger is a push that changed VERSION.
            PUBLISH=true
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION} publish=${PUBLISH}"

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: determine-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            artifact: llm-terminal-cli-linux-x64
          - target: linux-arm64
            artifact: llm-terminal-cli-linux-arm64
          - target: darwin-x64
            artifact: llm-terminal-cli-darwin-x64
          - target: darwin-arm64
            artifact: llm-terminal-cli-darwin-arm64
          - target: windows-x64
            artifact: llm-terminal-cli-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install

      - name: Build ${{ matrix.target }}
        run: bun run build:${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: [determine-version, build]
    if: needs.determine-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      # The top-level grant is read-only; only this job writes refs.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.version }}
          name: ${{ needs.determine-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/llm-terminal-cli-linux-x64
            dist/llm-terminal-cli-linux-arm64
            dist/llm-terminal-cli-darwin-x64
            dist/llm-terminal-cli-darwin-arm64
            dist/llm-terminal-cli-windows-x64.exe
            dist/SHA256SUMS
